name: Block PRs to milestone branch

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  block-pr-to-milestone:
    runs-on: ubuntu-latest
    name: Prevent PR merges to milestone/basic-resume-intake-and-generation
    steps:
      - name: Check target branch
        if: ${{ github.event.pull_request.base.ref == 'milestone/basic-resume-intake-and-generation' }}
        run: |
          echo "ERROR: Pull requests targeting 'milestone/basic-resume-intake-and-generation' are blocked by policy." >&2
          echo "Please open your PR against 'main' or create an issue describing the change and request maintainer assistance." >&2
          exit 1
