name: CI

on:
  push:
    branches: [dev, main, milestone/**, feat/**]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test --if-present

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/**/dist
            apps/**/dist
          if-no-files-found: ignore

  commit-msg-check:
    name: Commit message validation
    runs-on: ubuntu-latest
    # Only run on pull requests where commit messages should be validated
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Validate commit messages (conventional commits)
        uses: wagoid/commitlint-github-action@v4
        with:
          # default behavior checks commits in the PR
          configFile: .commitlintrc.js

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks scan
        # Use the community action to run gitleaks; run in warn-only mode initially
        uses: zricethezav/gitleaks-action@v2
        with:
          args: "--redact --report-path=gitleaks-report.json"
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
      - name: Continue on findings (warn)
        if: always()
        run: |
          echo "Gitleaks scan complete. Review the uploaded artifact 'gitleaks-report' for details."
