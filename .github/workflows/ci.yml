name: CI

env:
  GITLEAKS_VERSION: "8.24.3"

on:
  push:
    branches: [dev, main, milestone/**, feat/**]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main, milestone/**, feat/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, running npm install"
            npm install
          fi
      - name: Lint
        run: npm run lint --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, running npm install"
            npm install
          fi
      - name: Test
        run: npm test --if-present

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed, running npm install"
            npm install
          fi
      - name: Build
        run: npm run build --if-present
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/**/dist
            apps/**/dist
          if-no-files-found: ignore

  commit-msg-check:
    name: Commit message validation
    runs-on: ubuntu-latest
    # Only run on pull requests where commit messages should be validated
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Validate commit messages (conventional commits)
        uses: wagoid/commitlint-github-action@v4
        with:
          # default behavior checks commits in the PR
          configFile: .commitlintrc.js

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GL_VER=${GITLEAKS_VERSION}
          curl -sSL -o /tmp/gitleaks.tar.gz "https://github.com/zricethezav/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          mkdir -p /tmp/gitleaks && tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks

      - name: Run gitleaks (warn-only)
        id: gitleaks
        run: |
          /tmp/gitleaks/gitleaks detect --redact --report-path=gitleaks-report.json --report-format=sarif --config-path=.gitleaks.toml
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "gitleaks exited with $EXIT_CODE (warn-only)"
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
