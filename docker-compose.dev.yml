version: "3.8"

# Clean development docker-compose (hot-reload). Ports driven by env vars from .env.docker
# Use DEV_HOST_API_PORT and DEV_HOST_WEB_PORT to set host ports (defaults shown).

services:
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.development
      target: api-dev
    image: rb9k-api-dev:latest
    container_name: rb9k-api-dev
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-4000}
      HOST: ${HOST:-0.0.0.0}
      DATABASE_URL: ${DATABASE_URL:-/app/data/resume_builder_dev.db}
      ENABLE_TEST_ROUTES: ${ENABLE_TEST_ROUTES:-true}
      TEST_ROUTE_SECRET: ${TEST_ROUTE_SECRET}
      DOCKER_TESTING: ${DOCKER_TESTING:-true}
    ports:
      - "${DEV_HOST_API_PORT:-4001}:${API_PORT:-4000}"
      - "${NODE_INSPECT_PORT:-9229}:9229"
    volumes:
      - ./packages/api:/app/packages/api:cached
      - ./packages/core:/app/packages/core:cached
      - dev_api_data:/app/data
      - api_node_modules:/app/packages/api/node_modules
      - core_node_modules:/app/packages/core/node_modules
    networks:
      - rb9k-dev-network
    restart: unless-stopped
    command: ["npm", "run", "dev"]

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.development
      target: web-dev
    image: rb9k-web-dev:latest
    container_name: rb9k-web-dev
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WEB_PORT:-3000}
      HOSTNAME: ${HOSTNAME:-0.0.0.0}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${PLAYWRIGHT_API_PORT:-8081}}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    ports:
      - "${DEV_HOST_WEB_PORT:-3001}:${WEB_PORT:-3000}"
    depends_on:
      - api-dev
    volumes:
      - ./apps/web:/app/apps/web:cached
      - ./packages/core:/app/packages/core:cached
      - web_node_modules:/app/apps/web/node_modules
    networks:
      - rb9k-dev-network
    restart: unless-stopped
    command: ["npm", "run", "dev"]

networks:
  rb9k-dev-network:
    driver: bridge

volumes:
  dev_api_data:
  api_node_modules:
  core_node_modules:
  web_node_modules:
