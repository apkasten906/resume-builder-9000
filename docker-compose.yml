version: "3.8"

# Generic docker-compose for local or CI runs. Ports and runtime options are
# driven by env vars (prefer .env.docker for E2E / CI). Per-service env_file
# entries are used when you want to override defaults with a file.
services:
  api:
    env_file:
      - .env.docker
    build:
      context: .
      dockerfile: Dockerfile.production
      target: api-runtime
    image: rb9k-api:latest
    container_name: rb9k-api
    environment:
      - NODE_ENV=production
      - PORT=${API_PORT:-4000}
      - API_BASE=${API_PORT:-4000}
      - DATABASE_URL=${DATABASE_URL:-/app/data/resume.db}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${PLAYWRIGHT_API_PORT:-8081}:${API_PORT:-4000}"
    volumes:
      - api_data:/app/data
      - upload_data:/app/uploads
    networks:
      - rb9k-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:${API_PORT:-4000}/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    env_file:
      - .env.docker
    build:
      context: .
      dockerfile: Dockerfile.production
      target: web-runtime
    image: rb9k-web:latest
    container_name: rb9k-web
    environment:
      - NODE_ENV=production
      - PORT=${WEB_PORT:-3000}
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:${PLAYWRIGHT_API_PORT:-8081}}
      - API_URL=${API_URL:-http://api:${API_PORT:-4000}}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:${PLAYWRIGHT_WEB_PORT:-8080}}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    ports:
      - "${PLAYWRIGHT_WEB_PORT:-8080}:${WEB_PORT:-3000}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rb9k-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:${WEB_PORT:-3000}/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  rb9k-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  api_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/api

  upload_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/uploads
