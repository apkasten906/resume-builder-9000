openapi: 3.0.3
info:
  title: Resume Upload & Parse API
  version: 0.1.0
  description: API contract for resume upload, parse preview, and save flow (MVP text-layer PDFs only)
paths:
  /api/resumes/parse:
    post:
      summary: Upload a resume (PDF) and return parsed regions (transient)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        '200':
          description: List of parsed regions
          content:
            application/json:
              schema:
                type: object
                properties:
                  resumeId:
                    type: string
                    nullable: true
                  regions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ParsedRegion'
        '400':
          description: Invalid file or parse error

  /api/resumes/save:
    post:
      summary: Save reviewed parsed regions into the user's profile draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - consent
              properties:
                resumeId:
                  type: string
                  nullable: true
                consent:
                  type: boolean
                  description: Explicit user consent to persist parsed PII
                regions:
                  type: array
                  items:
                    $ref: '#/components/schemas/ParsedRegion'
      responses:
        '201':
          description: Save successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  savedId:
                    type: string
        '400':
          description: Validation error (missing consent or invalid regions)

components:
  schemas:
    ParsedRegion:
      type: object
      properties:
        id:
          type: string
        page:
          type: integer
        bbox:
          type: array
          description: '[x, y, width, height] in PDF points (tuple of 4 numbers)'
          items:
            type: number
          minItems: 4
          maxItems: 4
        text:
          type: string
        category:
          type: string
          enum: [contact, experience, education, skill, other]
        confidence:
          type: number
          format: float
